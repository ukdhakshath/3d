<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Printer AR Demo</title>

    <!-- Model Viewer -->
    <script
        type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">

            <h1>Printer AR Demo</h1>

            <p>
                Explore the printer in 3D, view feature videos,
                and experience it in AR.
            </p>

        </div>


        <!-- 3D MODEL -->

        <model-viewer
            id="printerModel"
            src="./models/printer.glb"
            alt="3D Printer Model"

            camera-controls
            touch-action="pan-y"

            shadow-intensity="1"
            exposure="1"

            camera-orbit="45deg 70deg 105%"

            ar
            ar-modes="webxr scene-viewer quick-look"
            ar-placement="floor">


            <!-- HOTSPOT 1 -->

            <button
                class="hotspot"
                slot="hotspot-1"
                data-position="-0.25m 0.45m 0.35m"
                data-normal="0m 0m 1m"
                data-video="./videos/hotspot1.mp4"
                aria-label="Paper Tray">

                <span class="hotspot-dot"></span>

            </button>


            <!-- HOTSPOT 2 -->

            <button
                class="hotspot"
                slot="hotspot-2"
                data-position="0.30m 0.35m 0.30m"
                data-normal="0m 0m 1m"
                data-video="./videos/hotspot2.mp4"
                aria-label="Control Panel">

                <span class="hotspot-dot"></span>

            </button>


            <!-- HOTSPOT 3 -->

            <button
                class="hotspot"
                slot="hotspot-3"
                data-position="-0.10m 0.05m 0.45m"
                data-normal="0m 0m 1m"
                data-video="./videos/hotspot3.mp4"
                aria-label="Output Tray">

                <span class="hotspot-dot"></span>

            </button>


            <!-- AR BUTTON -->

            <button
                slot="ar-button"
                class="ar-button">

                📱 View in AR

            </button>


        </model-viewer>


        <!-- INSTRUCTIONS -->

        <div class="instructions">

            <h2>How to Use</h2>

            <ol>
                <li>Rotate the printer using your mouse or finger.</li>

                <li>Zoom in and zoom out.</li>

                <li>Click a red hotspot to watch a feature video.</li>

                <li>Click View in AR on a supported mobile device.</li>
            </ol>

        </div>

    </div>


    <!-- VIDEO MODAL -->

    <div
        id="videoModal"
        class="video-modal">

        <div class="video-container">

            <button
                id="closeVideo"
                class="close-video"
                aria-label="Close video">

                ✕

            </button>


            <video
                id="hotspotVideo"
                controls
                playsinline>

                <source
                    id="videoSource"
                    src=""
                    type="video/mp4">

                Your browser does not support video playback.

            </video>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="./script.js"></script>

</body>

</html>
